# Externalized configuration placeholders for Azure App Configuration / Key Vault injection
server.port=${PORT:8080}
db.driver=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
db.host=${DB_HOST:jdbc:mysql://localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:onlinebookstore}
db.username=${DB_USERNAME:}
db.password=${DB_PASSWORD:}
db.connection.timeout.ms=${DB_CONNECTION_TIMEOUT_MS:10000}
db.validation.timeout.ms=${DB_VALIDATION_TIMEOUT_MS:5000}
db.idle.timeout.ms=${DB_IDLE_TIMEOUT_MS:600000}
db.max.lifetime.ms=${DB_MAX_LIFETIME_MS:1800000}
db.max.pool.size=${DB_MAX_POOL_SIZE:10}
db.min.idle=${DB_MIN_IDLE:2}
azure.redis.session.enabled=${AZURE_REDIS_SESSION_ENABLED:false}
azure.redis.session.prefix=${AZURE_REDIS_SESSION_PREFIX:onlinebookstore:session:}
azure.keyvault.secret.uri=${AZURE_KEY_VAULT_SECRET_URI:}
