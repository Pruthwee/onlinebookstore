# Cloud-ready configuration using environment variables
# These properties serve as defaults and can be overridden by environment variables
# For Azure deployment, set these via Azure App Configuration or App Service Configuration

# Database Configuration
# Override with environment variables: DB_DRIVER, DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
db.driver=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
db.host=${DB_HOST:jdbc:mysql://localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:onlinebookstore}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:root}

# Azure Cache for Redis Configuration (optional)
# Uncomment and configure when using Redis for session management
# redis.host=${REDIS_HOST:localhost}
# redis.port=${REDIS_PORT:6379}
# redis.password=${REDIS_PASSWORD:}
# redis.ssl=${REDIS_SSL:true}

# Azure Key Vault Configuration (optional)
# Uncomment when using Azure Key Vault for secrets management
# azure.keyvault.uri=${AZURE_KEYVAULT_URI:}
# azure.keyvault.tenant-id=${AZURE_TENANT_ID:}

# Application Configuration
app.name=OnlineBookStore
app.version=1.0.0-cloud-ready

# Logging Configuration
logging.level.root=INFO
logging.level.com.bittercode=DEBUG
